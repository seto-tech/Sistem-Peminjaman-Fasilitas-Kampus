version: '3.8'

services:
  # 🗄️ Layanan Database PostgreSQL untuk DBA & Backend
  postgres-db:
    image: postgres:15-alpine
    container_name: kampus_postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin_kampus
      POSTGRES_PASSWORD: password_rahasia_123
      POSTGRES_DB: db_peminjaman_fasilitas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 🌐 Alat Kelola Database (PgAdmin) berbasis Web
  pgadmin:
    image: dpage/pgadmin4
    container_name: kampus_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: devops@kampus.ac.id
      PGADMIN_DEFAULT_PASSWORD: adminpassword123
    ports:
      - "5050:80"
    depends_on:
      - postgres-db

volumes:
  postgres_data: