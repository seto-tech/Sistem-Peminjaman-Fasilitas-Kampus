services:
  postgres:
    image: postgres:15
    container_name: postgres_fasilitas_kampus
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hana789
      POSTGRES_DB: fasilitas_kampus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_fasilitas_kampus
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: adminkampus@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Laboran1945
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: